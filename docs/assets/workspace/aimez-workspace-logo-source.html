<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Newsreader:wght@500&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 320px;
    height: 132px;
    overflow: hidden;
    background: #ffffff;
  }
  .lockup {
    width: 320px;
    height: 132px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wordmark {
    font-family: "Newsreader", "IBM Plex Serif", Georgia, serif;
    font-weight: 500;
    font-size: 82px;
    letter-spacing: -0.02em;
    color: #3a4a5c;
  }
</style>
</head>
<body>
  <!-- Legacy wordmark bake source. Publisher-mark lockups now supersede this as the active direction. -->
  <div class="lockup">
    <span class="wordmark">aimez</span>
  </div>
</body>
</html>
