<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 132" width="320" height="132" aria-label="aimez wordmark lockup">
  <!--
    Legacy vector source for the workspace wordmark lockup.
    Typography: Newsreader 500, 82px, letter-spacing -0.02em, fill #3a4a5c.
    Bake to PNG: ./export-workspace-logo-from-svg.sh
  -->
  <defs>
    <style type="text/css"><![CDATA[
      @font-face {
        font-family: "Newsreader";
        font-style: normal;
        font-weight: 500;
        src: url("fonts/Newsreader-Medium.ttf") format("truetype");
      }
      .wordmark {
        font-family: "Newsreader", "IBM Plex Serif", Georgia, serif;
        font-weight: 500;
        font-size: 82px;
        letter-spacing: -0.02em;
        fill: #3a4a5c;
      }
    ]]></style>
  </defs>
  <rect width="320" height="132" fill="#ffffff"/>
  <text x="160" y="74" text-anchor="middle" dominant-baseline="middle" class="wordmark">aimez</text>
</svg>
