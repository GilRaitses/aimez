<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" aria-label="aimez social preview">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071018"/>
      <stop offset="55%" stop-color="#0f2433"/>
      <stop offset="100%" stop-color="#163544"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5ec8c0"/>
      <stop offset="100%" stop-color="#7eb8d8"/>
    </linearGradient>
    <style type="text/css"><![CDATA[
      @font-face {
        font-family: "Newsreader";
        font-style: normal;
        font-weight: 500;
        src: url("../fonts/Newsreader-Medium.ttf") format("truetype");
      }
      .company {
        font-family: "Newsreader", Georgia, serif;
        font-weight: 500;
        font-size: 96px;
        letter-spacing: -0.04em;
        fill: #e8eef6;
      }
      .line1 {
        font-family: "IBM Plex Sans", Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 34px;
        fill: #c5d2de;
      }
      .line2 {
        font-family: "IBM Plex Sans", Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 28px;
        fill: #5ec8c0;
      }
      .footer {
        font-family: "IBM Plex Sans", Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 24px;
        fill: #8aa0b2;
      }
    ]]></style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="12" height="630" fill="url(#accent)"/>
  <text x="88" y="168" class="company">aimez</text>
  <text x="88" y="260" class="line1">An applied AI research lab in New York</text>
  <text x="88" y="340" class="line2">
    <tspan x="88" dy="0">Storefronts that live on foot traffic can join a</tspan>
    <tspan x="88" dy="40">closed beta product called klosr.</tspan>
  </text>
  <text x="88" y="540" class="footer">aimez.ai</text>
</svg>
